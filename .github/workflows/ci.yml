name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # El repositorio define Prisma en PostgreSQL (producción). El CI usa SQLite,
  # así que el paso "Use SQLite schema" cambia el provider antes de las pruebas.
  DATABASE_URL: 'file:./dev.db'
  NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
  NEXTAUTH_SECRET: 'ci-secret-not-used-in-production'
  NEXTAUTH_URL: 'http://localhost:3000'

jobs:
  quality:
    name: Lint, typecheck, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use SQLite schema for CI
        run: node scripts/use-postgres.mjs sqlite

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push database schema
        run: npx prisma db push

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use SQLite schema for CI
        run: node scripts/use-postgres.mjs sqlite

      - name: Generate Prisma client & schema
        run: npx prisma generate && npx prisma db push

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          # Los E2E crean varios enlaces seguidos desde la misma IP.
          RATE_LIMIT_DISABLED: 'true'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
